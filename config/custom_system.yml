_include_yml: orthrus

preprocessing:
  build_graphs:
    time_window_size: 15.0
    node_label_features:
      subject: type, path, cmd_line
      file: type, path
      netflow: type, remote_ip, remote_port

featurization:
  feat_training:
    emb_dim: 128
    epochs: 50
    used_method: word2vec
    word2vec:
      alpha: 0.025
      window_size: 5
      min_count: 1
      use_skip_gram: True
      num_workers: 1
      compute_loss: True
      negative: 5
      decline_rate: 30

detection:
  graph_preprocessing:
    node_features: node_emb,node_type
    edge_features: none
    intra_graph_batching:
      used_methods: none

  gnn_training:
    lr: 0.0001
    node_hid_dim: 128
    node_out_dim: 128

    encoder:
      dropout: 0.3
      used_methods: custom_encoder
      custom_encoder:
        activation: relu
        num_layers: 3

    decoder:
      used_methods: predict_edge_type
      predict_edge_type:
        decoder: edge_mlp
        edge_mlp:
          src_dst_projection_coef: 2
          architecture_str: linear(0.5) | relu

  evaluation:
    used_method: node_evaluation
    node_evaluation:
      threshold_method: max_val_loss
      use_kmeans: False
